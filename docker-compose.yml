services:
# https://docs.prefect.io/v3/advanced/self-hosted#3-servers-1-background-service-postgres-redis
  prefect-postgres:
    image: postgres:15
    container_name: prefect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prefect-postgres:/var/lib/postgresql/data

  prefect-redis:
    image: redis:7
    container_name: prefect-redis
    restart: unless-stopped
    volumes:
      - prefect-redis:/data
  
  prefect-web:
    image: prefecthq/prefect:3.4-python3.10
    container_name: prefect-web
    restart: unless-stopped
    depends_on:
      - prefect-postgres
      - prefect-redis
    entrypoint: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      # https://linen.prefect.io/t/22877921/ulva73b9p-how-should-i-configure-my-postgres-backend-databas
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PREFECT_POSTGRES_HOST}:5432/${POSTGRES_DB}
      PREFECT_API_DATABASE_MIGRATE_ON_START: True
      PREFECT_MESSAGING_BROKER: ${PREFECT_MESSAGING_BROKER}
      PREFECT_MESSAGING_CACHE: ${PREFECT_MESSAGING_CACHE}
      PREFECT_REDIS_MESSAGING_HOST: ${PREFECT_REDIS_MESSAGING_HOST}
      PREFECT_REDIS_MESSAGING_PORT: ${PREFECT_REDIS_MESSAGING_PORT}
      PREFECT_SERVER_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING}
      PREFECT_API_URL: ${PREFECT_API_URL}
    ports:
      - 4200:4200

  prefect-agent-worker:
    image: phucdinh/prefect-agent-plus-python-libraries:v2.0.0
    container_name: prefect-agent-worker
    restart: unless-stopped
    depends_on:
      - prefect-web
    entrypoint: ["prefect", "worker", "start", "--pool", "default", "--name", "PANLOCAL"]
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL}
      # same value with PREFECT_SERVER_API_AUTH_STRING
      PREFECT_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING}
      AIRBYTE_USERNAME: ${AIRBYTE_USERNAME}
      AIRBYTE_PASSWORD: ${AIRBYTE_PASSWORD}
      AIRBYTE_SERVER_HOST: ${AIRBYTE_SERVER_HOST}
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: ${PREFECT_RESULTS_PERSIST_BY_DEFAULT}
    network_mode: "host" 

volumes:
  prefect-postgres:
    name: prefect-postgres
  prefect-redis:
    name: prefect-redis